name: Windows credential setup tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  credentials:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows PowerShell 5.1 and DPAPI
        shell: powershell
        run: .\tests\Test-ProductionCredentialSetup.ps1
